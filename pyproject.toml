[build-system]
requires = ["setuptools>=68,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-rag-generator"
version = "0.1.0"
description = "Collection-scoped document retrieval and grounded question answering"
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi==0.137.1", "uvicorn==0.49.0", "python-multipart==0.0.32",
  "pydantic==2.12.5", "pydantic-settings==2.14.1", "httpx==0.28.1", "numpy==2.2.6",
  "pypdf==6.9.2", "python-docx==1.2.0", "sentence-transformers==5.3.0",
  "faiss-cpu==1.14.3", "streamlit==1.65.0", "filelock==3.25.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.0"]

[tool.setuptools.packages.find]
include = ["app*", "frontend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["model: downloads or loads a real embedding model (opt-in)"]
